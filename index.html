
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>健康保険の扶養 かんたんチェック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface-2:#F6F9F8;
  --ink:#16302B; --muted:#4F6660; --line:#D3DFDA;
  --primary:#1E6B57; --primary-ink:#FFFFFF; --primary-weak:#DCEDE6;
  --warn:#9A6212; --warn-weak:#FBF0D9;
  --ng:#B23A2E; --ng-weak:#F8E2DE;
  --focus:#2F80ED;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1A17; --surface:#172521; --surface-2:#1C2D28;
    --ink:#E6EFEC; --muted:#9DB3AC; --line:#2C3E39;
    --primary:#5FC3A2; --primary-ink:#0F1A17; --primary-weak:#1E3A32;
    --warn:#E3B04B; --warn-weak:#3A2E15;
    --ng:#F08A7E; --ng-weak:#3D1F1B;
    --focus:#7FB3FF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1A17; --surface:#172521; --surface-2:#1C2D28;
  --ink:#E6EFEC; --muted:#9DB3AC; --line:#2C3E39;
  --primary:#5FC3A2; --primary-ink:#0F1A17; --primary-weak:#1E3A32;
  --warn:#E3B04B; --warn-weak:#3A2E15;
  --ng:#F08A7E; --ng-weak:#3D1F1B;
  --focus:#7FB3FF;
}
*,*::before,*::after{box-sizing:inherit;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{margin:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
  font-size:17px; line-height:1.8;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:640px; margin:0 auto; padding:24px 16px 64px;}
h1,h2,h3{font-family:'Zen Maru Gothic','BIZ UDPGothic','Hiragino Maru Gothic ProN',sans-serif; font-weight:700; margin:0;}
button{font:inherit; color:inherit;}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px;}

/* header */
.top{display:flex; align-items:center; gap:12px; margin-bottom:20px;}
.top .icon{
  width:44px; height:44px; border-radius:12px; flex-shrink:0;
  background:var(--primary); color:var(--primary-ink);
  display:grid; place-items:center;
}
.top h1{font-size:19px; line-height:1.4;}
.top p{margin:0; font-size:13px; color:var(--muted); line-height:1.5;}

/* progress */
.progress{margin-bottom:16px;}
.progress .bar{height:8px; background:var(--line); border-radius:99px; overflow:hidden;}
.progress .fill{height:100%; background:var(--primary); border-radius:99px; transition:width .3s ease;}
.progress .txt{font-size:13px; color:var(--muted); margin-top:6px; display:flex; justify-content:space-between;}

/* card */
.card{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:28px 22px;}
@media (min-width:560px){ .card{padding:36px 34px;} }
.q{font-size:23px; line-height:1.55; margin-bottom:10px;}
.lead{color:var(--muted); font-size:15.5px; margin:0 0 22px;}

/* choices */
.choices{display:flex; flex-direction:column; gap:10px;}
.choice{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  padding:16px 18px; min-height:60px;
  background:var(--surface-2); border:2px solid var(--line); border-radius:14px;
  cursor:pointer; transition:border-color .12s, background .12s;
}
.choice:hover{border-color:var(--primary);}
.choice.sel{border-color:var(--primary); background:var(--primary-weak);}
.choice .mark{
  width:24px; height:24px; border-radius:50%; flex-shrink:0;
  border:2px solid var(--line); background:var(--surface);
  display:grid; place-items:center;
}
.choice.multi .mark{border-radius:6px;}
.choice.sel .mark{border-color:var(--primary); background:var(--primary); color:var(--primary-ink);}
.choice .t{font-weight:700; font-size:16.5px; display:block; line-height:1.5;}
.choice .d{display:block; font-size:14px; color:var(--muted); line-height:1.6; margin-top:2px;}

.group{margin-bottom:26px;}
.group > .gl{font-weight:700; font-size:16.5px; margin-bottom:10px; display:block;}
.row-choices{display:grid; grid-template-columns:1fr; gap:8px;}
@media (min-width:480px){ .row-choices.c3{grid-template-columns:repeat(3,1fr);} .row-choices.c2{grid-template-columns:repeat(2,1fr);} }
.row-choices .choice{min-height:52px; padding:12px 14px;}
.row-choices .choice .t{font-size:15.5px;}

/* hint */
details.hint{margin-top:22px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line);}
details.hint summary{cursor:pointer; padding:12px 16px; font-weight:700; font-size:15px; color:var(--primary); list-style:none; display:flex; align-items:center; gap:8px;}
details.hint summary::-webkit-details-marker{display:none;}
details.hint summary::before{content:"？"; width:22px; height:22px; border-radius:50%; background:var(--primary); color:var(--primary-ink); font-size:13px; display:grid; place-items:center; flex-shrink:0;}
details.hint[open] summary{border-bottom:1px solid var(--line);}
details.hint .body{padding:12px 16px 14px; font-size:14.5px; color:var(--muted); line-height:1.8;}
details.hint .body p{margin:0 0 8px;} details.hint .body p:last-child{margin:0;}

/* inputs */
.field{margin-bottom:24px;}
.field label.fl{display:block; font-weight:700; font-size:16.5px; margin-bottom:4px;}
.field .fh{font-size:14px; color:var(--muted); margin:0 0 10px; line-height:1.6;}
.money{display:flex; gap:8px; align-items:stretch; flex-wrap:wrap;}
.money .inbox{flex:1 1 180px; display:flex; align-items:center; background:var(--surface-2); border:2px solid var(--line); border-radius:12px; padding:0 14px;}
.money .inbox:focus-within{border-color:var(--primary);}
.money input{flex:1; min-width:0; border:none; background:transparent; color:var(--ink); font:inherit; font-size:21px; padding:12px 0; font-variant-numeric:tabular-nums;}
.money input:focus{outline:none;}
.money .yen{color:var(--muted); font-size:15px; margin-left:6px;}
.seg{display:flex; border:2px solid var(--line); border-radius:12px; overflow:hidden; flex-shrink:0;}
.seg button{border:none; background:var(--surface-2); padding:0 16px; min-height:52px; cursor:pointer; font-size:15px; color:var(--muted);}
.seg button.on{background:var(--primary); color:var(--primary-ink); font-weight:700;}
.conv{font-size:14px; color:var(--muted); margin-top:6px; min-height:1.6em;}
.conv b{color:var(--ink);}

.calc{margin-top:10px; padding:14px; border:1px dashed var(--line); border-radius:12px; font-size:14.5px;}
.calc .cr{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
.calc input{width:88px; padding:8px 10px; border:2px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); font:inherit; font-size:16px;}
.calc .apply{margin-top:10px;}

.note{padding:12px 16px; border-radius:12px; font-size:14.5px; line-height:1.75; margin-top:14px;}
.note.info{background:var(--primary-weak);}
.note.warn{background:var(--warn-weak);}

/* nav */
.nav{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:28px;}
.btn{border:none; border-radius:12px; padding:14px 26px; min-height:52px; font-weight:700; font-size:16px; cursor:pointer;}
.btn.primary{background:var(--primary); color:var(--primary-ink);}
.btn.primary:disabled{opacity:.35; cursor:not-allowed;}
.btn.ghost{background:transparent; color:var(--muted); padding:14px 8px;}
.btn.ghost:hover{color:var(--ink);}
.btn.wide{width:100%;}
.btn.small{padding:8px 14px; min-height:40px; font-size:14px; background:var(--primary-weak); color:var(--ink);}
.err{color:var(--ng); font-size:14px; margin-top:6px;}

/* intro */
.intro-hero{font-size:26px; line-height:1.55; margin-bottom:14px;}
.intro-points{list-style:none; padding:0; margin:0 0 24px;}
.intro-points li{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); font-size:15.5px; line-height:1.7;}
.intro-points li:last-child{border-bottom:none;}
.intro-points .ic{width:30px; height:30px; border-radius:50%; background:var(--primary-weak); color:var(--primary); display:grid; place-items:center; flex-shrink:0; font-weight:700;}

/* result */
.verdict{border-radius:18px; padding:24px 22px; margin-bottom:22px; display:flex; gap:18px; align-items:center;}
.verdict.ok{background:var(--primary-weak);}
.verdict.warn{background:var(--warn-weak);}
.verdict.ng{background:var(--ng-weak);}
.verdict .big{
  width:76px; height:76px; border-radius:50%; flex-shrink:0;
  display:grid; place-items:center; font-size:40px; font-weight:700;
  font-family:'Zen Maru Gothic',sans-serif; background:var(--surface);
}
.verdict.ok .big{color:var(--primary);} .verdict.warn .big{color:var(--warn);} .verdict.ng .big{color:var(--ng);}
.verdict h2{font-size:22px; line-height:1.5;}
.verdict p{margin:4px 0 0; font-size:14.5px; color:var(--muted); line-height:1.7;}

.sec-title{font-size:18px; margin:28px 0 12px;}
.reqs{display:flex; flex-direction:column; gap:10px;}
.req{display:flex; gap:14px; padding:14px 16px; border:1px solid var(--line); border-radius:14px; background:var(--surface-2);}
.req .st{width:34px; height:34px; border-radius:50%; flex-shrink:0; display:grid; place-items:center; font-weight:700; font-size:18px;}
.req .st.ok{background:var(--primary-weak); color:var(--primary);}
.req .st.warn{background:var(--warn-weak); color:var(--warn);}
.req .st.ng{background:var(--ng-weak); color:var(--ng);}
.req .st.skip{background:var(--line); color:var(--muted);}
.req h3{font-size:16px; line-height:1.5; font-family:'BIZ UDPGothic',sans-serif;}
.req p{margin:2px 0 0; font-size:14.5px; color:var(--muted); line-height:1.75;}

/* gauge: the one visual the user remembers */
.gauge{margin-top:10px; padding:16px 16px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--line);}
.gauge .gt{font-size:14px; font-weight:700; margin-bottom:28px;}
.gauge .track{position:relative; height:18px; background:var(--line); border-radius:99px;}
.gauge .val{position:absolute; left:0; top:0; bottom:0; border-radius:99px;}
.gauge .val.ok{background:var(--primary);} .gauge .val.ng{background:var(--ng);} .gauge .val.warn{background:var(--warn);}
.gauge .wall{position:absolute; top:-24px; bottom:-6px; width:0; border-left:3px dashed var(--ink);}
.gauge .wall span{position:absolute; top:-2px; left:6px; white-space:nowrap; font-size:12.5px; font-weight:700;}
.gauge .wall.flip span{left:auto; right:6px;}
.gauge .legend{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-top:8px; gap:10px; flex-wrap:wrap;}

.docs{list-style:none; padding:0; margin:0;}
.docs li{padding:10px 0 10px 30px; position:relative; border-bottom:1px solid var(--line); font-size:15px; line-height:1.7;}
.docs li::before{content:""; position:absolute; left:4px; top:16px; width:14px; height:14px; border:2px solid var(--primary); border-radius:4px;}
.docs li small{display:block; color:var(--muted); font-size:13.5px;}

.next{margin-top:24px; padding:18px 20px; border-radius:14px; background:var(--primary); color:var(--primary-ink);}
.next h3{font-size:17px; margin-bottom:6px;}
.next p{margin:0; font-size:15px; line-height:1.8;}

.disclaimer{margin-top:22px; font-size:12.5px; color:var(--muted); line-height:1.8; border-top:1px solid var(--line); padding-top:14px;}
.actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:20px;}

@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
@media print{
  body{background:#fff; color:#000;}
  .progress,.actions,.top .icon{display:none;}
  .card{border:none; padding:0;}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-7-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 7 3.5C19 16.5 12 21 12 21z"/><path d="M9.5 12.5l2 2 3.5-4"/></svg>
    </div>
    <div>
      <h1>健康保険の扶養 かんたんチェック</h1>
      <p>協会けんぽに加入している方向け｜家族を扶養に入れられるか、目安を確かめます（2026年10月時点の基準）</p>
    </div>
  </header>
  <div class="progress" id="progress" hidden>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="txt"><span id="ptxt"></span><span id="pname"></span></div>
  </div>
  <main class="card" id="card" aria-live="polite"></main>
</div>

<script>
/* ===== 状態 ===== */
const S = {
  relation:null, living:null, residence:null, abroadReason:null,
  age:null, disability:null, parent2:null,
  work:null, ownIns:null, hours:null, student:null, company:null,
  incomeTypes:[],
  amt:{ salary:{v:'',u:'m'}, pension:{v:'',u:'y'}, business:{v:'',u:'y'}, other:{v:'',u:'y'} },
  daily:{ unemp:'', sick:'' },
  myIncome:'', remit:'', remitMethod:null, apartStudent:null, taxDep:null
};
let history = ['intro'];
const cur = () => history[history.length-1];

const STEP_NAMES = {
  relation:'ご家族との関係', living:'一緒に住んでいるか', residence:'住んでいる国', abroad:'海外にいる理由',
  age:'年齢', disability:'障害の有無', parent2:'お子さまのもう一人の親', work:'働き方',
  ownIns:'勤務先の健康保険', workDetail:'勤務の条件', incomeTypes:'収入の種類',
  incomeAmounts:'収入の金額', taxDep:'税金の扶養', support:'生活費の支え方'
};

/* ===== 流れ ===== */
function flow(){
  const f = ['relation','living','residence'];
  if(S.residence==='abroad') f.push('abroad');
  f.push('age');
  if(['u19','19to22','23to59'].includes(S.age)) f.push('disability');
  if(S.relation==='child') f.push('parent2');
  f.push('work');
  if(S.work==='part' || S.work==='full') f.push('ownIns');
  if(S.work==='part' && S.ownIns!=='yes') f.push('workDetail');
  f.push('incomeTypes');
  if(hasAmt()) f.push('incomeAmounts');
  f.push('taxDep','support');
  return f;
}
function hardStop(){
  return S.relation==='none'
    || (S.relation==='other3' && S.living==='apart')
    || (S.residence==='abroad' && S.abroadReason==='none')
    || S.age==='75plus'
    || S.ownIns==='yes';
}
function next(){
  const c = cur();
  if(c==='intro'){ history.push('relation'); return render(); }
  if(hardStop()){ history.push('result'); return render(); }
  const f = flow(); const i = f.indexOf(c);
  history.push(i>=0 && i<f.length-1 ? f[i+1] : 'result');
  render();
}
function back(){ if(history.length>1){ history.pop(); render(); } }
function restart(){
  Object.assign(S, {relation:null, living:null, residence:null, abroadReason:null, age:null, disability:null, parent2:null,
    work:null, ownIns:null, hours:null, student:null, company:null, incomeTypes:[],
    amt:{ salary:{v:'',u:'m'}, pension:{v:'',u:'y'}, business:{v:'',u:'y'}, other:{v:'',u:'y'} },
    daily:{unemp:'',sick:''}, myIncome:'', remit:'', remitMethod:null, apartStudent:null, taxDep:null});
  history=['intro']; render();
}

/* ===== 便利関数 ===== */
const num = v => { const n = Number(String(v).replace(/[,，\s]/g,'')); return isFinite(n) ? n : NaN; };
const yen = n => Math.round(n).toLocaleString('ja-JP') + '円';
const man = n => { const m = n/10000; return (Math.round(m*10)/10).toLocaleString('ja-JP') + '万円'; };
const AMT_TYPES = ['salary','pension','business','other','unemp','sick'];
const hasAmt = () => S.incomeTypes.some(k=>AMT_TYPES.includes(k));
function cap(){ // 収入の上限（万円）
  if(S.age==='60to74' || S.disability==='yes') return 180;
  if(S.age==='19to22' && !['spouse','naien'].includes(S.relation)) return 150;
  return 130;
}
function annualOf(k){ const a=S.amt[k]; const n=num(a.v); if(isNaN(n)) return 0; return a.u==='m' ? n*12 : n; }
function totalIncome(){
  let t=0; ['salary','pension','business','other'].forEach(k=>{ if(S.incomeTypes.includes(k)) t+=annualOf(k); }); return t;
}

/* ===== 画面パーツ ===== */
const check = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function opt(field, v, t, d, sel){
  return `<button type="button" class="choice${sel?' sel':''}" data-pick="${field}" data-v="${v}">
    <span class="mark">${sel?check:''}</span><span><span class="t">${t}</span>${d?`<span class="d">${d}</span>`:''}</span></button>`;
}
function question(q, lead, field, options, hint){
  return `<h2 class="q">${q}</h2>${lead?`<p class="lead">${lead}</p>`:''}
    <div class="choices">${options.map(o=>opt(field,o[0],o[1],o[2],S[field]===o[0])).join('')}</div>
    ${hint?hintBox(hint[0],hint[1]):''}${navRow(false)}`;
}
function hintBox(title, body){ return `<details class="hint"><summary>${title}</summary><div class="body">${body}</div></details>`; }
function navRow(showNext, enabled=true, label='次へ'){
  return `<div class="nav"><button type="button" class="btn ghost" data-act="back">← もどる</button>
    ${showNext?`<button type="button" class="btn primary" data-act="next" ${enabled?'':'disabled'}>${label}</button>`:'<span></span>'}</div>`;
}
function moneyField(id, label, help, val, unit, withUnit){
  return `<div class="field"><label class="fl" for="${id}">${label}</label>${help?`<p class="fh">${help}</p>`:''}
    <div class="money"><div class="inbox"><input id="${id}" data-money="${id}" inputmode="numeric" autocomplete="off" placeholder="0" value="${val}"><span class="yen">円</span></div>
    ${withUnit?`<div class="seg" role="group" aria-label="期間"><button type="button" data-unit="${id}" data-u="m" class="${unit==='m'?'on':''}">月あたり</button><button type="button" data-unit="${id}" data-u="y" class="${unit==='y'?'on':''}">1年あたり</button></div>`:''}
    </div><div class="conv" id="conv-${id}"></div></div>`;
}

/* ===== 各画面 ===== */
const screens = {
intro: () => `
  <h2 class="intro-hero">ご家族を、あなたの健康保険の扶養に入れられるか確かめましょう</h2>
  <p class="lead">質問に順番に答えるだけです。むずかしい言葉には「？」で説明をつけています。</p>
  <ul class="intro-points">
    <li><span class="ic">1</span><span><b>かかる時間は3分ほど</b><br>10個前後の質問に答えます。</span></li>
    <li><span class="ic">2</span><span><b>手元にあると便利なもの</b><br>ご家族の給料・年金の金額がわかるもの（雇用契約書、年金の通知など）と、あなたの年収。</span></li>
    <li><span class="ic">3</span><span><b>わかること</b><br>扶養に入れそうか、足りない条件は何か、会社に出す書類の目安。</span></li>
  </ul>
  <button type="button" class="btn primary wide" data-act="next">チェックをはじめる</button>
  <p class="disclaimer" style="border:none; padding-top:6px;">このチェックは「健康保険の扶養」についてです。税金の扶養（配偶者控除・扶養控除）は別の基準です。入力内容はこの画面の中だけで使い、どこにも送信されません。</p>`,

relation: () => question('扶養に入れたいのは、あなたから見てどなたですか？',
  '続き柄によって、一緒に住んでいる必要があるかどうかが変わります。', 'relation', [
  ['spouse','配偶者（夫・妻）','籍を入れている夫・妻'],
  ['naien','事実婚（籍を入れていない）の夫・妻','戸籍と住民票で関係を確認します'],
  ['child','子ども・孫','養子も含みます'],
  ['parent','あなたの父母・祖父母','曾祖父母も含みます'],
  ['sibling','兄弟姉妹',''],
  ['other3','上の4つ以外の親族','配偶者の父母（義理の親）、おじ・おば、おい・めい、子どもの配偶者、事実婚の相手の父母・子など'],
  ['none','親族ではない、またはもっと遠い親戚','いとこ、友人、婚約者など']

/* ===== 判定 ===== */
function evaluate(){
  const R = []; // {name, st:'ok'|'warn'|'ng'|'skip', text}
  const C = cap();
  const relName = {spouse:'配偶者',naien:'事実婚の配偶者',child:'子ども・孫',parent:'父母・祖父母',sibling:'兄弟姉妹',other3:'その他の親族（3親等以内）',none:''}[S.relation];

  // 1 家族の範囲
  if(S.relation==='none') R.push({name:'扶養に入れる家族の範囲', st:'ng', text:'健康保険の扶養に入れるのは、あなたの3親等以内の親族です。いとこや友人などは対象になりません。'});
  else if(S.relation==='other3'){
    if(S.living==='apart') R.push({name:'扶養に入れる家族の範囲', st:'ng', text:`${relName}は、あなたと同じ家に住んでいることが条件です。別々に住んでいる場合は扶養に入れません。`});
    else if(S.living==='tanshin') R.push({name:'扶養に入れる家族の範囲', st:'warn', text:`${relName}は同居が条件です。単身赴任中の扱いは健康保険によって異なるため、総務課に確認してください。`});
    else R.push({name:'扶養に入れる家族の範囲', st:'ok', text:`${relName}は、同じ家に住んでいるので対象になります。`});
  } else R.push({name:'扶養に入れる家族の範囲', st:'ok', text:`${relName}は、一緒に住んでいても別々に住んでいても対象になります。`});

  // 2 住所
  if(S.residence){
    if(S.residence==='domestic') R.push({name:'住んでいる国', st:'ok', text:'日本国内に住んでいるので、条件を満たしています。'});
    else if(S.abroadReason==='none') R.push({name:'住んでいる国', st:'ng', text:'海外に住んでいる方は、留学や海外赴任への同行などの例外を除き、扶養に入れません。'});
    else if(S.abroadReason) R.push({name:'住んでいる国', st:'warn', text:'海外に住んでいますが、例外として認められる理由に当てはまります。留学なら学生証や在学証明、同行ならビザなど、理由を証明する書類が必要です。'});
  }

  // 3 年齢
  if(S.age){
    if(S.age==='75plus') R.push({name:'年齢', st:'ng', text:'75歳以上の方は「後期高齢者医療制度」に入るため、扶養には入れません。'});
    else R.push({name:'年齢', st:'ok', text:`年齢の条件は満たしています。収入の上限は年${C}万円未満です${C===150?'（19歳〜22歳の特例）':C===180?'（60歳以上または障害のある方の特例）':''}。`});
  }

  // 4 共働きの子
  if(S.relation==='child' && S.parent2){
    if(S.parent2==='spouse') R.push({name:'どちらの親の扶養に入るか', st:'ng', text:'共働きの場合、お子さまは原則として年収が多い方の扶養に入ります。配偶者の方が多いので、配偶者側の健康保険に入るのが基本です。'});
    else if(S.parent2==='same') R.push({name:'どちらの親の扶養に入るか', st:'warn', text:'協会けんぽでは、わずかな差でも年収が多い方の扶養に入ります。お二人の今後1年間の見込み年収をくらべて、あなたの方が多いかを総務課と確認してください。'});
    else if(S.parent2==='single') R.push({name:'どちらの親の扶養に入るか', st:'ok', text:'もう一人の親がお子さまを扶養に入れていないことを確認できれば問題ありません。'});
    else R.push({name:'どちらの親の扶養に入るか', st:'ok', text:'あなたが主に家計を支えているので、あなたの扶養に入れます。'});
  }

  // 5 本人の健康保険
  if(S.work){
    let r;
    if(S.ownIns==='yes') r={st:'ng', text:'勤務先の健康保険に自分で入っているので、扶養には入れません。'};
    else if(S.work==='full') r={st:'ng', text:'フルタイムで働く方は、通常は勤務先の健康保険に自分で入ることになるため、扶養には入れません。加入していない理由を勤務先に確認してください。'};
    else if(S.work==='part'){
      if(S.hours==='30plus') r={st:'ng', text:'週30時間以上働く場合、多くは勤務先の健康保険に入る必要があります。会社の規模に関係なく対象になるのが一般的です。'};
      else if(S.hours==='20to30'){
        if(S.student==='day') r={st:'ok', text:'昼間の学生は、週20時間以上働いていても勤務先の健康保険に入る対象外です。'};
        else if(S.company==='51plus') r={st:'ng', text:'週20時間以上・従業員51人以上の会社・学生でない、の条件がそろっているため、給料の額に関係なく勤務先の健康保険に入る対象です（2026年10月から給料の条件がなくなりました）。'};
        else if(S.company==='unknown') r={st:'warn', text:'勤務先の従業員が51人以上なら、勤務先の健康保険に入る対象になります。その方の勤務先に確認してください。'};
        else r={st:'ok', text:'今の条件では勤務先の健康保険に入る対象ではありません。ただし2027年10月から対象が「従業員36人以上の会社」に広がる予定で、その後も段階的に広がります。'};
      } else r={st:'ok', text:'週20時間未満なので、勤務先の健康保険に入る対象ではありません。'};
      if(S.ownIns==='unknown' && r.st==='ok') r={st:'warn', text:r.text+' 念のため、本人名義の保険証を受け取っていないか確認してください。'};
    } else r={st:'ok', text: S.work==='self' ? '自営業の方は国民健康保険の対象ですが、収入が基準内なら扶養に入れます。' : '働いていないので、この条件は問題ありません。'};
    R.push({name:'その方自身の健康保険', ...r});
  }

  // 6 収入
  const total = totalIncome();
  let incomeRes = null;
  if(S.incomeTypes.length){
    const limitY = C*10000;
    const dLimit = limitY/360;
    const msgs=[]; let st='ok';
    if(!hasAmt()){
      incomeRes={name:'収入の上限', st:'ok', text:`収入がない（退職などでなくなる）ので、条件を満たしています（上限は年${C}万円未満）。`};
    } else {
      if(total >= limitY){ st='ng'; msgs.push(`年収の見込みが${man(total)}で、上限の${C}万円以上です。`); }
      else msgs.push(`年収の見込みは${man(total)}で、上限の${C}万円未満です。`);
      ['unemp','sick'].forEach(k=>{
        if(!S.incomeTypes.includes(k)) return;
        const d=num(S.daily[k]); const nm = k==='unemp'?'失業手当':'傷病手当金・出産手当金';
        if(!isNaN(d) && d >= dLimit){ st='ng'; msgs.push(`${nm}の日額${yen(d)}が基準（${yen(Math.ceil(dLimit))}）以上のため、受け取っている間は扶養に入れません。受け取り終わってから改めて申請できます。`); }
        else if(!isNaN(d) && d>0) msgs.push(`${nm}の日額は基準（${yen(Math.ceil(dLimit))}未満）を満たしています。`);
      });
      if(st==='ok' && total >= limitY*0.9) { st='warn'; msgs.push('上限にかなり近いため、勤務時間や時給が増えると外れる可能性があります。'); }
      const onlySalary = S.incomeTypes.every(k=>k==='salary');
      if(onlySalary && st!=='ng') msgs.push('収入が給料だけの場合、2026年4月から雇用契約書の条件で計算した年収で判定されます。');
      incomeRes={name:'収入の上限', st, text:msgs.join(' ')};
    }
    R.push(incomeRes);
  }

  // 7 生計維持
  let supportRes=null, gauge2=null;
  if(S.living==='apart' && S.remit!==''){
    const ry = num(S.remit)*12;
    if(!(ry>0)) supportRes={st:'ng', text:'別々に住んでいる場合は、あなたからの仕送りが必要です。'};
    else if(total < ry) supportRes = (S.remitMethod==='cash' && S.apartStudent!=='yes')
      ? {st:'warn', text:`年収${man(total)}は仕送り1年分の${man(ry)}より少ないので条件を満たしますが、手渡しは証明ができません。銀行振込に切り替えることをおすすめします。`}
      : {st:'ok', text:`年収${man(total)}は、仕送り1年分の${man(ry)}より少ないので条件を満たしています。`};
    else supportRes={st:'ng', text:`年収${man(total)}が、仕送り1年分の${man(ry)}以上です。別居の場合は、仕送りの方が多い必要があります。`};
    gauge2={title:'その方の年収 と あなたからの仕送り（1年分）', val:total, wall:ry, wallLabel:`仕送り ${man(ry)}`, st:supportRes.st};
  } else if(S.myIncome!=='' && (S.living==='together'||S.living==='tanshin')){
    const my=num(S.myIncome), half=my/2;
    if(total < half) supportRes={st:'ok', text:`年収${man(total)}は、あなたの年収の半分（${man(half)}）未満なので条件を満たしています。`};
    else if(total < my) supportRes={st:'warn', text:`年収${man(total)}が、あなたの年収の半分（${man(half)}）以上です。ただし、あなたの年収を下回っていて、あなたが家計の中心と認められれば扶養に入れる場合があります。世帯の状況を総務課に相談してください。`};
    else supportRes={st:'ng', text:`年収${man(total)}が、あなたの年収（${man(my)}）以上のため、あなたが家計を主に支えているとは認められにくい状況です。`};
    gauge2={title:'その方の年収 と あなたの年収の半分', val:total, wall:half, wallLabel:`半分 ${man(half)}`, st:supportRes.st};
  }
  if(supportRes) R.push({name: S.living==='apart' ? '仕送りで生活を支えているか（別居）' : 'あなたが家計を支えているか（同居）', ...supportRes});

  const any = s => R.some(r=>r.st===s);
  const overall = any('ng') ? 'ng' : any('warn') ? 'warn' : 'ok';
  const gauge1 = incomeRes && hasAmt() ? {title:`その方の年収 と 上限（${C}万円）`, val:total, wall:C*10000, wallLabel:`上限 ${C}万円`, st: total>=C*10000?'ng':(total>=C*9000?'warn':'ok')} : null;
  return {R, overall, gauge1, gauge2, total};
}

function gaugeHTML(g){
  if(!g) return '';
  const max = Math.max(g.val, g.wall) * 1.25 || 1;
  const vp = Math.min(100, g.val/max*100), wp = Math.min(100, g.wall/max*100);
  return `<div class="gauge"><div class="gt">${g.title}</div>
    <div class="track"><div class="val ${g.st}" style="width:${Math.max(vp,1.5)}%"></div>
      <div class="wall${wp>65?' flip':''}" style="left:${wp}%"><span>${g.wallLabel}</span></div></div>
    <div class="legend"><span>その方の年収：<b style="color:var(--ink)">${man(g.val)}</b></span><span>${g.val < g.wall ? '線より左なら条件クリア' : '線を超えています'}</span></div></div>`;
}

function docsList(){
  const d = [], T = S.incomeTypes;
  d.push(['健康保険 被扶養者（異動）届','会社（総務課）が用意し、会社から日本年金機構に提出します']);
  d.push(['あなたとご家族のマイナンバー','届書に書くことで、省略できる書類があります']);
  if(S.relation==='naien') d.push(['事実婚であることがわかる書類','お二人の戸籍謄本（抄本）と、あなたの世帯全員の住民票。発行から90日以内・コピー不可・マイナンバーの記載がないもの']);
  else d.push(['続き柄がわかる書類','ご家族の戸籍謄本（抄本）、またはあなたが世帯主で同じ世帯なら住民票。発行から90日以内・コピー不可・マイナンバーの記載がないもの。会社が確認すれば提出を省略できる場合があります']);
  if(S.taxDep==='yes'){
    d.push(['収入を証明する書類は原則いりません','税金の扶養に入っているため、会社の証明で足ります']);
  } else {
    const amt = T.filter(k=>AMT_TYPES.includes(k));
    const onlySalary = amt.length>0 && amt.every(k=>k==='salary') && !T.includes('retired');
    if(onlySalary){
      d.push(['雇用契約書（労働条件通知書）のコピー','あわせて「給与収入のみです」という申し立てが必要です。届書の申立欄に書けば、別紙はいりません']);
    } else {
      if(T.includes('retired')) d.push(['退職証明書、または離職票のコピー','']);
      if(T.includes('unemp')) d.push(['雇用保険受給資格者証のコピー','']);
      if(T.includes('pension')) d.push(['年金額改定通知書などのコピー','今の年金額がわかるもの']);
      if(T.includes('business')||T.includes('other')) d.push(['直近の確定申告書のコピー','']);
      const special = ['retired','unemp','pension','business'].some(k=>T.includes(k));
      if(!special || T.includes('salary') || T.includes('sick')) d.push(['課税（非課税）証明書','市区町村の役所や、マイナンバーカードがあればコンビニで取れます']);
    }
  }
  if(['pension','unemp','sick'].some(k=>T.includes(k))) d.push(['税金のかからない収入の金額がわかる通知書のコピー','障害年金・遺族年金・傷病手当金・出産手当金・失業手当を受け取っている場合']);
  if(S.living==='apart' && S.apartStudent!=='yes') d.push(['仕送りの記録', S.remitMethod==='genkin' ? '現金書留の控えのコピー' : '通帳のコピー（名義のページと、振込日・金額のページ）や振込明細。送った人・受け取った人・金額がわかるもの']);
  if(S.residence==='abroad' && S.abroadReason && S.abroadReason!=='none') d.push(['海外にいる理由を証明する書類','留学なら学生ビザや在学証明書、同行なら査証など（日本語訳をつけます）']);
  return d;
}

function resultScreen(){
  const {R, overall, gauge1, gauge2} = evaluate();
  const head = {
    ok:['○','扶養に入れる見込みです','入力された内容では、すべての条件を満たしています。総務課で手続きを進めましょう。'],
    warn:['△','確認が必要な点があります','大きな問題はなさそうですが、下の「△」の項目を総務課と確認してください。'],
    ng:['×','今の条件では扶養に入るのは難しい見込みです','下の「×」の項目が条件を満たしていません。状況が変われば入れる場合もあるので、総務課に相談してください。']
  }[overall];
  const stIcon = {ok:'○', warn:'△', ng:'×', skip:'―'};
  const stopped = hardStop();
  const docs = docsList();
  return `
    <div class="verdict ${overall}"><div class="big" aria-hidden="true">${head[0]}</div><div><h2>${head[1]}</h2><p>${head[2]}</p></div></div>
    ${gaugeHTML(gauge1)}${gauge2?'<div style="height:10px"></div>'+gaugeHTML(gauge2):''}
    <h3 class="sec-title">条件ごとの結果</h3>
    <div class="reqs">${R.map(r=>`<div class="req"><div class="st ${r.st}" aria-label="${{ok:'満たしている',warn:'要確認',ng:'満たしていない'}[r.st]}">${stIcon[r.st]}</div><div><h3>${r.name}</h3><p>${r.text}</p></div></div>`).join('')}
    ${stopped?`<div class="req"><div class="st skip">―</div><div><h3>そのほかの条件</h3><p>上の「×」の条件で扶養に入れないことがわかったため、ここで確認を終えました。</p></div></div>`:''}</div>
    ${overall!=='ng'?`<h3 class="sec-title">手続きで必要になる書類の目安</h3><ul class="docs">${docs.map(x=>`<li>${x[0]}${x[1]?`<small>${x[1]}</small>`:''}</li>`).join('')}</ul>`:''}
    ${overall!=='ng' && ['spouse','naien'].includes(S.relation) && ['19to22','23to59'].includes(S.age) ? '<div class="note info">配偶者が20歳以上60歳未満の場合、同じ用紙で「国民年金の第3号被保険者」の届け出も一緒に行います。これで配偶者は自分で年金保険料を払わなくてよくなります。</div>' : ''}
    <div class="next"><h3>次にすること</h3><p>${
      overall==='ok' ? 'この画面を見せながら、総務課に「家族を扶養に入れたい」と伝えてください。結婚・退職など扶養に入る理由ができた日から5日以内に届け出る決まりです。60日以上遅れると追加の書類が必要になるので、早めに相談しましょう。'
      : overall==='warn' ? 'この画面を総務課の担当者に見せて、「△」の項目を一緒に確認してください。'
      : '扶養に入れない場合、ご家族は国民健康保険や勤務先の健康保険に加入することになります。収入や勤務時間を見直す予定があれば、その内容も含めて総務課に相談してください。'}</p></div>
    <p class="disclaimer">この結果はあくまで目安です。協会けんぽの扶養の手続きは、会社を通じて日本年金機構に届け出て、そこで最終的に判断されます。状況によっては、ここに書かれていない書類を求められることがあります。基準は2026年10月時点の制度にもとづいています。税金の扶養（配偶者控除・扶養控除）は別の基準のため、このチェックでは判定していません。</p>
    <div class="actions">
      <button type="button" class="btn ghost" data-act="back">← 答えを直す</button>
      <button type="button" class="btn small" data-act="print">結果を印刷する</button>
      <button type="button" class="btn small" data-act="restart">最初からやり直す</button>
    </div>`;
}

/* ===== 描画 ===== */
function renderProgress(){
  const c = cur(), p = document.getElementById('progress');
  if(c==='intro' || c==='result'){ p.hidden = true; return; }
  p.hidden = false;
  const f = flow(); const i = f.indexOf(c);
  const pct = Math.round((i)/(f.length) * 100);
  document.getElementById('fill').style.width = Math.max(pct,4)+'%';
  document.getElementById('ptxt').textContent = `質問 ${i+1} / ${f.length}`;
  document.getElementById('pname').textContent = STEP_NAMES[c] || '';
}
function render(){
  renderProgress();
  const card = document.getElementById('card');
  card.innerHTML = screens[cur()]();
  updateConversions();
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}

/* 金額の換算表示 */
function getMoney(id){
  if(S.amt[id]) return S.amt[id].v;
  if(id in S.daily) return S.daily[id];
  return S[id];
}
function setMoney(id, v){
  if(S.amt[id]) S.amt[id].v = v;
  else if(id in S.daily) S.daily[id] = v;
  else S[id] = v;
}
function updateConversions(){
  document.querySelectorAll('[data-money]').forEach(inp=>{
    const id = inp.dataset.money, el = document.getElementById('conv-'+id); if(!el) return;
    const n = num(inp.value);
    if(inp.value==='' || isNaN(n)){ el.textContent=''; return; }
    if(S.amt[id]) el.innerHTML = S.amt[id].u==='m' ? `1年あたり <b>${yen(n*12)}</b>（${man(n*12)}）` : `1か月あたり 約 <b>${yen(n/12)}</b>`;
    else if(id==='remit') el.innerHTML = `1年あたり <b>${yen(n*12)}</b>（${man(n*12)}）`;
    else if(id==='myIncome') el.innerHTML = `${man(n)}／半分は <b>${man(n/2)}</b>`;
    else el.innerHTML = `${yen(n)}／日`;
  });
  // 支え方画面の「次へ」
  if(cur()==='support'){
    const b = document.querySelector('[data-act="next"]');
    if(b) b.disabled = S.living==='apart' ? !(S.remit!=='' && !isNaN(num(S.remit)) && S.remitMethod && (!['u19','19to22'].includes(S.age) || S.apartStudent)) : !(S.myIncome!=='' && !isNaN(num(S.myIncome)));
  }
}
function calcPreview(){
  const w=num(document.getElementById('c-wage').value), h=num(document.getElementById('c-hrs').value), d=num(document.getElementById('c-days').value);
  const t=num(document.getElementById('c-trans').value||0);
  const out=document.getElementById('c-out');
  if([w,h,d].some(x=>isNaN(x)||x<=0)){ out.textContent=''; return null; }
  const m = w*h*d*52/12 + (isNaN(t)?0:t);
  out.innerHTML = `1か月あたり 約 <b>${yen(m)}</b>／1年あたり 約 <b>${yen(m*12)}</b>`;
  return Math.round(m);
}

/* ===== 操作 ===== */
document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.pick){
    const f=b.dataset.pick, v=b.dataset.v; S[f]=v;
    // 依存する回答を整理
    if(f==='residence' && v==='domestic') S.abroadReason=null;
    if(f==='work' && v!=='part'){ S.hours=S.student=S.company=null; }
    if(f==='work' && (v==='none'||v==='self')) S.ownIns=null;
    if(f==='hours' && v!=='20to30'){ S.student=S.company=null; }
    if(['workDetail','support'].includes(cur())){ const y=window.scrollY; render(); window.scrollTo(0,y); return; }
    return next();
  }
  if(b.dataset.multi){
    const v=b.dataset.multi; let t=S.incomeTypes;
    if(v==='none') t = t.includes('none') ? t.filter(x=>x!=='none') : t.filter(x=>x==='retired').concat('none');
    else { if(v!=='retired') t=t.filter(x=>x!=='none'); t = t.includes(v) ? t.filter(x=>x!==v) : [...t, v]; }
    S.incomeTypes=t; const y=window.scrollY; render(); window.scrollTo(0,y); return;
  }
  if(b.dataset.unit){ S.amt[b.dataset.unit].u=b.dataset.u; document.querySelectorAll(`[data-unit="${b.dataset.unit}"]`).forEach(x=>x.classList.toggle('on', x.dataset.u===b.dataset.u)); updateConversions(); return; }
  const a=b.dataset.act;
  if(a==='back') return back();
  if(a==='restart') return restart();
  if(a==='print') return window.print();
  if(a==='calc'){ const m=calcPreview(); if(m!=null){ S.amt.salary.v=String(m); S.amt.salary.u='m'; const y=window.scrollY; render(); window.scrollTo(0,y);} return; }
  if(a==='next'){
    if(cur()==='incomeAmounts'){
      const ids=[...document.querySelectorAll('[data-money]')].map(i=>i.dataset.money);
      const bad=ids.some(id=>{ const v=getMoney(id); return v==='' || isNaN(num(v)) || num(v)<0; });
      if(bad){ document.getElementById('amt-err').hidden=false; return; }
    }
    return next();
  }
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.dataset.money){ setMoney(t.dataset.money, t.value.trim()); updateConversions(); }
  if(t.id && t.id.startsWith('c-')) calcPreview();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.matches('input')){ const n=document.querySelector('[data-act="next"]:not([disabled])'); if(n) n.click(); }
});

render();
</script>
